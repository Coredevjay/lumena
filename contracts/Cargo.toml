[workspace]
resolver = "2"
members = [
    "paymaster",
    "session-keys",
    "social-recovery",
    "token-sep41",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lumen-network/lumen"
authors = ["Lumen Contributors"]

[workspace.dependencies]
soroban-sdk = "21.0.0"

# Shared lint set inherited by every contract crate via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"

# Soroban charges deployment fees proportional to WASM size, so release
# builds are tuned for the smallest possible binary.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
