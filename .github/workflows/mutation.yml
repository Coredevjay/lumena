name: Mutation Testing

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/server/src/policy/**'
      - 'packages/server/src/__tests__/policy-*'
      - 'packages/server/stryker.config.json'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:

jobs:
  stryker-policy:
    name: Stryker (policy engine)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run Stryker on src/policy
        run: pnpm --filter "@lumen/server" test:mutation

      - name: Record mutation score
        if: always()
        working-directory: packages/server
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            node --input-type=module -e "
              import fs from 'node:fs';
              const report = JSON.parse(fs.readFileSync('reports/mutation/mutation.json', 'utf8'));
              let killed = 0, timeout = 0, survived = 0, noCoverage = 0;
              for (const file of Object.values(report.files)) {
                for (const m of file.mutants) {
                  if (m.status === 'Killed') killed++;
                  else if (m.status === 'Timeout') timeout++;
                  else if (m.status === 'Survived') survived++;
                  else if (m.status === 'NoCoverage') noCoverage++;
                }
              }
              const detected = killed + timeout;
              const valid = detected + survived + noCoverage;
              const score = valid === 0 ? 0 : (detected / valid) * 100;
              const lines = [
                '### Mutation score (src/policy)',
                '',
                '| Score | Killed | Timeout | Survived | No coverage |',
                '|---|---|---|---|---|',
                '| ' + score.toFixed(2) + '% | ' + killed + ' | ' + timeout + ' | ' + survived + ' | ' + noCoverage + ' |',
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            "
          fi

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: packages/server/reports/mutation/
          retention-days: 30
