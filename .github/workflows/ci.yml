name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require changeset for schema snapshot changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if echo "$changed" | grep -q '^packages/server/src/__tests__/__snapshots__/'; then
            if ! echo "$changed" | grep -Eq '^\.changeset/.+\.md$'; then
              echo "::error::OpenAPI/policy schema snapshots changed. Add a changeset (pnpm changeset) describing the schema change."
              exit 1
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Run linter
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Validate AsyncAPI document
        run: pnpm exec asyncapi validate docs/asyncapi.yaml

      - name: Validate WebSocket sample messages against AsyncAPI schemas
        run: pnpm --filter "@lumen/server" test:asyncapi

      - name: Build packages
        run: pnpm build

      - name: Validate package publishing (publint)
        run: pnpm exec publint packages/core packages/server packages/web-sdk packages/react

      - name: Validate type resolution (arethetypeswrong)
        run: |
          for pkg in core server web-sdk react; do
            pnpm exec attw --pack "packages/$pkg" --profile node16
          done

      - name: CJS require smoke test
        shell: bash
        run: |
          for pkg in core server web-sdk react; do
            node -e "
              const mod = require('./packages/$pkg');
              if (!mod || typeof mod !== 'object') {
                throw new Error('CJS entry for @lumen/$pkg did not export an object');
              }
              if (Object.keys(mod).length === 0) {
                throw new Error('CJS entry for @lumen/$pkg has no exports');
              }
              console.log('CJS require OK for @lumen/$pkg:', Object.keys(mod).join(', '));
            "
          done

      - name: Run unit tests with coverage
        run: pnpm --filter "@lumen/core" test:coverage && pnpm --filter "@lumen/server" test:coverage && pnpm --filter "@lumen/web-sdk" test:coverage && pnpm --filter "@lumen/react" test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/core/coverage/
            packages/server/coverage/
            packages/web-sdk/coverage/
            packages/react/coverage/
          retention-days: 14

      - name: Post coverage summary comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const packages = ['core', 'server', 'web-sdk', 'react'];
            let body = '## 📊 Test Coverage Summary\n\n';
            body += '| Package | Statements | Branches | Functions | Lines |\n';
            body += '|---------|-----------|----------|-----------|-------|\n';

            for (const pkg of packages) {
              const summaryPath = path.join('packages', pkg, 'coverage', 'coverage-summary.json');
              if (!fs.existsSync(summaryPath)) {
                body += `| @lumen/${pkg} | N/A | N/A | N/A | N/A |\n`;
                continue;
              }
              try {
                const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                const t = summary.total;
                const fmt = (v) => `${v.pct}% (${v.covered}/${v.total})`;
                body += `| @lumen/${pkg} | ${fmt(t.statements)} | ${fmt(t.branches)} | ${fmt(t.functions)} | ${fmt(t.lines)} |\n`;
              } catch {
                body += `| @lumen/${pkg} | error | error | error | error |\n`;
              }
            }

            body += '\n> Coverage reports uploaded as workflow artifacts.';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('## 📊 Test Coverage Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  load-smoke:
    # Short k6 smoke load against /health and /cosign. p95 latency and
    # error-rate thresholds are defined in packages/server/__tests__/load/smoke.js
    # and documented in packages/server/README.md; a breach fails this job.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Start server
        working-directory: packages/server
        run: |
          COSIGNER_SECRET=$(node --input-type=module -e "import { Keypair } from '@stellar/stellar-sdk'; console.log(Keypair.random().secret())")
          FEE_PAYER_SECRET=$(node --input-type=module -e "import { Keypair } from '@stellar/stellar-sdk'; console.log(Keypair.random().secret())")
          export COSIGNER_SECRET FEE_PAYER_SECRET RATE_LIMIT_MAX=1000000 PORT=3000
          nohup node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become healthy"
          cat server.log
          exit 1

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke load test
        run: k6 run packages/server/__tests__/load/smoke.js
