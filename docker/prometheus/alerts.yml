groups:
  - name: lumen-service
    rules:
      - alert: SponsorBalanceCritical
        expr: lumen_sponsor_balance_xlm < 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Sponsor account balance is below 100 XLM
          description: Top up the sponsor account immediately; see the runbook for refill and verification steps.
          runbook_url: https://github.com/utilityjnr1/lumena/blob/main/docs/runbooks/sponsor-balance-depletion.md

      - alert: CosignErrorRateHigh
        expr: |
          sum(rate(lumen_cosign_requests_total{status="rejected"}[5m]))
          /
          clamp_min(sum(rate(lumen_cosign_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Co-sign error rate is above 5%
          description: Check signer health and key configuration; follow the runbook to isolate the failing signer.
          runbook_url: https://github.com/utilityjnr1/lumena/blob/main/docs/runbooks/signer-failure.md

      - alert: RPCLatencySpike
        expr: lumen_stellar_endpoint_latency_ms > 2000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Stellar RPC endpoint latency is above 2 seconds
          description: Verify Horizon status and fail over to a backup endpoint; see the runbook for outage handling.
          runbook_url: https://github.com/utilityjnr1/lumena/blob/main/docs/runbooks/horizon-outage.md

      - alert: PolicyLatencySpike
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(lumen_policy_evaluation_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Policy evaluation p95 latency is above 2 seconds
          description: Inspect policy evaluation load and replay/fraud signals; follow the runbook to triage.
          runbook_url: https://github.com/utilityjnr1/lumena/blob/main/docs/runbooks/replay-fraud.md