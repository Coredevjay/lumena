replicaCount: 2

image:
  repository: ghcr.io/utilityjnr1/lumen-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

serviceMonitor:
  enabled: true

env:
  STELLAR_NETWORK: testnet
secrets:
  databaseUrl: ""