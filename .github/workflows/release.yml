name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify registry URL and Node version
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Registry URL: $(npm config get registry)"
          if [ "$(npm config get registry)" != "https://registry.npmjs.org/" ]; then
            echo "Unexpected npm registry configured"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json

      - name: Diff OpenAPI spec against previous release
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ] || ! git cat-file -e "$PREV_TAG:docs/openapi.yaml" 2>/dev/null; then
            echo "No previous release spec found; skipping OpenAPI diff"
            exit 0
          fi
          mkdir -p /tmp/oasdiff
          git show "$PREV_TAG:docs/openapi.yaml" > /tmp/oasdiff/base.yaml
          cp docs/openapi.yaml /tmp/oasdiff/revision.yaml
          docker run --rm -v /tmp/oasdiff:/specs tufin/oasdiff changelog /specs/base.yaml /specs/revision.yaml > /tmp/oasdiff/changelog.md
          if [ -s /tmp/oasdiff/changelog.md ]; then
            {
              echo ""
              echo "## Unreleased (changes since $PREV_TAG)"
              echo ""
              cat /tmp/oasdiff/changelog.md
            } >> docs/api-changelog.md
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}