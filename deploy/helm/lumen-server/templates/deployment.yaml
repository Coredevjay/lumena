apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumen-server.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: lumen-server
  template:
    metadata:
      labels:
        app: lumen-server
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: STELLAR_NETWORK
              value: {{ .Values.env.STELLAR_NETWORK | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}